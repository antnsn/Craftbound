title: Craftbound
description: Profession levelling for World of Warcraft Forever. How to use it, page by page.
url: https://antnsn.github.io
baseurl: /Craftbound

theme: just-the-docs
color_scheme: craftbound

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub:
    - https://github.com/antnsn/Craftbound
aux_links_new_tab: true

footer_content: Craftbound is a fan-made addon for World of Warcraft Forever. Not affiliated with Blizzard Entertainment.

callouts:
  note:
    title: Note
    color: yellow
  warning:
    title: Careful
    color: red
  tip:
    title: Tip
    color: green

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - superpowers

defaults:
  - scope:
      path: ""
    values:
      layout: default
